<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
M&S Sistema Central
</title>


<link rel="stylesheet" href="estilos-central.css">


</head>


<body>


<div class="sistema-central">


<!-- ==========================
HEADER INSTITUCIONAL
========================== -->

<header class="header-central">


<div class="identidad">


<img 
src="../img/logo.png"
class="logo-central"
alt="Logo M&S">


<div class="nombre-sistema">


<h1>
M&S Sistema Central
</h1>


<span>
M&S Abogados Consultores
</span>


</div>


</div>



<div class="modulo-actual">


<span>
Módulo Actual
</span>


<h2 id="tituloModulo">
Dashboard
</h2>


</div>




<div class="usuario-central">


<strong id="nombreUsuario">
Usuario
</strong>


<span id="rolUsuario">
Rol
</span>


<button id="btnCerrarSesion">
Cerrar Sesión
</button>


</div>



</header>





<!-- ==========================
CUERPO PRINCIPAL
========================== -->


<div class="contenedor-central">



<!-- SIDEBAR -->


<aside class="sidebar-central">


<nav id="menuCentral">


</nav>


</aside>





<!-- CONTENIDO -->


<main class="contenido-central">



<div class="breadcrumb">


<span>
Inicio
</span>


>

<span id="breadcrumbModulo">
Dashboard
</span>


</div>





<section id="vistaCentral">

Bienvenido al Sistema Central
</h2>


<p>
Seleccione un módulo para comenzar.
</p>


</section>

</div>






<!-- FOOTER -->


<footer class="footer-central">


<div>
M&S Sistema Central
</div>


<div>
Versión 3.0.0
</div>


<div>
© 2026 M&S Abogados Consultores
</div>
